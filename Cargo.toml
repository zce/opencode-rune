    "apps/desktop-library",
    "apps/desktop-thin",
    "apps/installer",
    "apps/web",
    "features/annotations",
    "features/composer-input",
    "features/connect",
    "features/dictation",
    "features/egg",
    "features/files",
    "features/find",
    "features/history",
    "features/inbox",
    "features/mcp",
    "features/mentions",
    "features/narrow",
    "features/notifications",
    "features/office",
    "features/open-in",
    "features/panels",
    "features/projects",
    "features/restore",
    "features/review",
    "features/session-menu",
    "features/settings",
    "features/subagents",
    "features/switcher",
    "features/tab-groups",
    "features/terminal-surface",
    "features/timeline-extras",
    "features/tips",
    "features/updater",
    "features/workspace-tools",
    "crates/authenticode",
    "crates/browser-extensions",
    "crates/browser-pane",
    "crates/browser-policy",
    "crates/harness-log",
    "crates/hex-client",
    "crates/office-library",
    "crates/office-preview",
    "crates/opencode-code-view",
    "crates/opencode-i18n",
    "crates/opencode-kernel",
    "crates/opencode-kit",
    "crates/opencode-platform",
    "crates/opencode-plugin-runtime",
    "crates/opencode-plugin-spec",
    "crates/opencode-runtime",
    "crates/opencode-search",
    "crates/opencode-servers",
    "crates/opencode-storage",
    "crates/opencode-ui",
    "crates/otlp-lite",
    "crates/project-icon",
    "crates/rune-parts",
    "crates/session-view",
    "crates/terminal",
    "crates/ureq-web",
    "crates/win-install",
]
exclude = ["apps/browser-engine"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Rune's default features less two the app doesn't use: `embedded-fonts` (the app registers its own
# faces, so Rune's bundled Inter was 1.25 MB nobody drew with) and `ogg-audio` (Ogg and Opus audio
# for macOS video, which apps/desktop turns on for macOS alone).
rune = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da", default-features = false, features = ["accessibility", "dbus", "metal-backend", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
rune-luau = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
rune-mermaid = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
rune-i18n = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
rune-knobs = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
rune-perf = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
rune-register = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
base64 = "0.22"
mlua = { git = "https://github.com/mlua-rs/mlua", rev = "a0ad4535fc72ba89967a931c5be57b162b5f0f3f", features = ["luau"] }
polling = "3.11"
# Objects keep their keys in the order they arrive, as JavaScript's do: a tool's arguments list as
# Desktop lists them.
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3.4", default-features = false }
url = "2"

# BetterOffice's Word engine builds against its own yrs fork, as its workspace patches it.
[patch.crates-io]
# mimalloc with small pages committed on demand too (`vendor/libmimalloc-sys.patch`): ~11 MB less at Home, ~26 MB after a busy
# spell, no launch or frame cost measured. Keep the version equal to what `mimalloc` asks for.
libmimalloc-sys = { path = "vendor/libmimalloc-sys" }
# Rune's wgpu-hal (wgpu-hal as published plus `dx12::Instance::expose_adapter`, partial presents, and
# removed-device fence handling, `vendor/wgpu-hal` in the Rune repo), at the Rune rev pinned above.
# Keep the rev equal to the `rune` rev.
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
# Rune's winit (winit 0.30 as published plus `vendor/winit.patch`: a new Windows window isn't added again
# to the taskbar it's already on, which cost CoInitializeEx and a TaskbarList COM object on the UI
# thread before the first frame, and Wayland `content_corner_radius`). Keep the rev equal to the `rune` rev.
winit = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
# Rune's sctk-adwaita (as published plus `vendor/sctk-adwaita.patch`: rounded bottom corners on Wayland
# client-side frames and `AdwaitaFrame::content_corner_radius`). Keep the rev equal to the `rune` rev.
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
# Rune's accesskit_windows (0.35.2 as published plus `vendor/accesskit_windows.patch`: headings and
# landmarks reach UI Automation; a field past 64 KiB keeps its text pattern). At the same rev as `rune`.
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
# Rune's accesskit_macos (0.27.2 as published plus `vendor/accesskit_macos.patch`: headings reach
# VoiceOver as AppKit's AXHeading with their level; a field past 64 KiB keeps its line ranges). At the same
# rev as `rune`.
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
# Rune's parley_engine (0.12.0 as published plus `vendor/parley_engine.patch`: UAX #9 rule L1 at a
# paragraph's end, so Unicode's BidiTest.txt passes whole; segmenters and font metrics made once,
# not for every text and run). Keep the rev equal to the `rune` rev.
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
# Rune's naga (30.0.1 as published plus `vendor/naga.patch`: constant-folding an expression to an earlier
# handle neither stretches nor inverts an `Emit` range, gfx-rs/wgpu#7793; rune#1815). Keep the rev equal to the `rune` rev.
naga = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
# Rune's accesskit_atspi_common (0.21.1 as published plus `vendor/accesskit_atspi_common.patch`: item roles read their
# own `size_of_set`; rune#1819). Keep the rev equal to the `rune` rev.
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "82ec595b5caebeaa17aa51e0da38df3c0a8fb2da" }
yrs = { git = "https://github.com/openooxml/y-crdt.git", rev = "e785c00611ebce79ece115defa25295982cac165" }

# Keep dependencies lean in dev (opt-level = 1 cuts cold build time, RAM, and target/ size
# across Windows/macOS/Linux), while keeping full -O3 on the small set of CPU-hot crates
# that draw glyphs, shade icons, or decode images/streams every frame.
[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.dev.package.project-icon]
opt-level = 3
[profile.dev.package.rune]
opt-level = 3
[profile.dev.package.rune-text]
opt-level = 3
[profile.dev.package.rune-image]
opt-level = 3
[profile.dev.package.parley_engine]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.opencode-search]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3

# What ships, and what timing measures (build it with apps/desktop/scripts/release.ps1, which adds the
# profile-guided optimisation profile): the whole program optimised as one (fat LTO, one codegen unit),
# 25 to 60 minutes and about 10 GB for one rustc, so only on a machine that can spare them. No debug info:
# with it the one LTO module outgrew 28 GB. Native stacks with names come from `perf` builds.
[profile.release]
lto = "fat"
codegen-units = 1
incremental = false

# The office viewer (BetterOffice's engines: 19 MiB of the macOS exe's 92 MiB of code at opt-level 3) is built for
# size: no launch runs it, and every MiB of the exe is 5.7 ms of the first launch after an install on an M4
# (macOS reads a new exe whole) and Defender's read on Windows. Profiles that inherit `release` take it too.
[profile.release.package.betteroffice-base-latin]
opt-level = "s"
[profile.release.package.betteroffice-docx-edit]
opt-level = "s"
[profile.release.package.betteroffice-docx-layout]
opt-level = "s"
[profile.release.package.betteroffice-docx-parse]
opt-level = "s"
[profile.release.package.betteroffice-docx-raster]
opt-level = "s"
[profile.release.package.betteroffice-drawingml]
opt-level = "s"
[profile.release.package.betteroffice-fonts]
opt-level = "s"
[profile.release.package.betteroffice-fonts-intl]
opt-level = "s"
[profile.release.package.betteroffice-fonts-latin]
opt-level = "s"
[profile.release.package.betteroffice-metafile]
opt-level = "s"
[profile.release.package.betteroffice-ooxml-diff]
opt-level = "s"
[profile.release.package.betteroffice-ooxml-raster]
opt-level = "s"
[profile.release.package.betteroffice-ooxml-text]
opt-level = "s"
[profile.release.package.betteroffice-opc]
opt-level = "s"
[profile.release.package.betteroffice-pptx]
opt-level = "s"
[profile.release.package.betteroffice-pptx-edit]
opt-level = "s"
[profile.release.package.betteroffice-pptx-parse]
opt-level = "s"
[profile.release.package.betteroffice-pptx-raster]
opt-level = "s"
[profile.release.package.betteroffice-pptx-render]
opt-level = "s"
[profile.release.package.betteroffice-xlsx]
opt-level = "s"
[profile.release.package.betteroffice-xlsx-calc]
opt-level = "s"
[profile.release.package.betteroffice-xlsx-model]
opt-level = "s"
[profile.release.package.betteroffice-xlsx-ops]
opt-level = "s"
[profile.release.package.betteroffice-xlsx-parse]
opt-level = "s"
[profile.release.package.betteroffice-xlsx-raster]
opt-level = "s"
[profile.release.package.betteroffice-xlsx-render]
opt-level = "s"
[profile.release.package.office-library]
opt-level = "s"
[profile.release.package.office-preview]
opt-level = "s"
[profile.release.package.opencode-feature-office]
opt-level = "s"

# A release build in minutes, for iterating on something you then time with `release`: 16 codegen units,
# no cross-crate LTO. Not incremental: an optimised build's incremental state outlived a Rune bump and
# linked against `anon.*.llvm.*` symbols the new units no longer had (LNK2019), and CI builds without it.
[profile.release-quick]
inherits = "release"
lto = false
codegen-units = 16

# Fastest edit-compile-run loop for local dev: skips DWARF/PDB emission and maximizes parallel codegen.
[profile.dev-fast]
inherits = "dev"
debug = 0
codegen-units = 64

# Near-release runtime speed at a fraction of fat-LTO's ~10 GB RAM and 25-60 min build time.
[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.perf]
inherits = "release-quick"
incremental = false
debug = 1

[workspace.lints.rust]
# shared-lints begin
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# shared-lints end
unsafe_code = "warn"

[workspace.lints.clippy]
# shared-lints begin
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
# shared-lints end
let_underscore_must_use = "warn"
disallowed_methods = "warn"
undocumented_unsafe_blocks = "warn"
